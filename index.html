<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.chat{
width:100%;
max-width:420px;
height:100vh;
background:#111827;
display:flex;
flex-direction:column;
}

.header{
background:#1f2937;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
color:white;
border-bottom:1px solid #374151;
}

#chat{
flex:1;
overflow-y:auto;
padding:18px;
color:white;
}

.message{
margin-bottom:14px;
padding:12px;
border-radius:12px;
max-width:85%;
word-wrap:break-word;
}

.user{
background:#2563eb;
margin-left:auto;
}

.bot{
background:#374151;
margin-right:auto;
}

.input-area{
display:flex;
padding:12px;
background:#1f2937;
gap:10px;
}

#message{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#374151;
color:white;
font-size:16px;
outline:none;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}
</style>

</head>

<body>

<div class="chat">

<div class="header">
🤖 Nova AI
</div>

<div id="chat">

<div class="message bot">
Привет! Я Nova. Чем могу помочь?
</div>

</div>

<div class="input-area">

<input
id="message"
placeholder="Напишите сообщение..."
>

<button onclick="sendMessage()">
Отправить
</button>

</div>

<script>

const chat = document.getElementById("chat");

function addMessage(text, type){

const div = document.createElement("div");

div.className="message "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}

async function sendMessage(){

const input=document.getElementById("message");

const text=input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value="";

try{

const response=await fetch(
"https://nova-ai.s67471219.workers.dev/",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
}
);

if(!response.ok){

addMessage("Ошибка сервера: "+response.status,"bot");

return;

}

const data=await response.json();

let answer="";

if(data.reply){

answer=data.reply;

}else if(data.response){

answer=data.response;

}else if(data.text){

answer=data.text;

}else{

answer=JSON.stringify(data);

}

addMessage(answer,"bot");

}catch(err){

addMessage("Ошибка подключения: "+err.message,"bot");

}

}

document.getElementById("message").addEventListener("keydown",(e)=>{

if(e.key==="Enter"){

sendMessage();

}

});

</script>
</div>

</body>

</html>
