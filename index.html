<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova AI</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    width: 90%;
}

.core {
    width: 120px;
    height: 120px;
    margin: auto;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow:
    0 0 20px #ffffff,
    0 0 50px #2563eb;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }
}

h1 {
    font-size: 42px;
    letter-spacing: 5px;
    margin-top: 30px;
}

.subtitle {
    color: #aaa;
    font-size: 16px;
}

.chat {
    margin-top: 40px;
}

input {
    width: 80%;
    padding: 15px;
    border-radius: 25px;
    border: none;
    background: #111;
    color: white;
    font-size: 16px;
}

button {
    margin-top: 15px;
    padding: 14px 35px;
    border-radius: 25px;
    border: none;
    background: white;
    color: black;
    font-size: 16px;
}

</style>

</head>

<body>

<div class="container">

<div class="core"></div>

<h1>NOVA</h1>

<div class="subtitle">
Personal AI Assistant
</div>

<div class="chat">

<input placeholder="Напишите Nova...">

<br>

<button>
Отправить
</button>

</div>

</div>

</body>
</html>
