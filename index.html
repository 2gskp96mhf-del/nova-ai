<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin:0;
    height:100vh;
    background:#050505;
    color:white;
    font-family:-apple-system, BlinkMacSystemFont, Arial;
    display:flex;
    flex-direction:column;
}

.header {
    text-align:center;
    padding:35px 0 20px;
}

.core {
    width:130px;
    height:130px;
    margin:auto;
    border-radius:50%;
    border:2px solid white;
    box-shadow:
    0 0 25px white,
    0 0 60px #2563eb;
    animation:pulse 2s infinite;
}

@keyframes pulse {
    50% {
        transform:scale(1.08);
    }
}

h1 {
    letter-spacing:8px;
    font-size:38px;
    margin:25px 0 5px;
}

.status {
    color:#aaa;
}

.chat {
    flex:1;
    padding:20px;
    text-align:center;
}

.message {
    background:#111;
    border-radius:20px;
    padding:15px;
    margin:20px 0;
}

.input {
    position:fixed;
    bottom:75px;
    left:5%;
    width:90%;
    display:flex;
}

input {
    flex:1;
    padding:15px;
    border-radius:25px;
    border:none;
    background:#151515;
    color:white;
}

button {
    margin-left:10px;
    border-radius:50%;
    width:50px;
    border:none;
}

.menu {
    position:fixed;
    bottom:0;
    width:100%;
    height:65px;
    background:#0b0b0b;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.item {
    color:#aaa;
    font-size:12px;
    text-align:center;
}

.item span {
    display:block;
    font-size:22px;
}

</style>

</head>

<body>

<div class="header">

<div class="core"></div>

<h1>NOVA</h1>

<div class="status">
Personal AI Assistant • Online
</div>

</div>


<div class="chat">

<div class="message">
Привет. Я Nova. Готова помочь.
</div>

</div>


<div class="input">

<div class="input">
<input id="message" placeholder="Напишите Nova...">
<button onclick="sendMessage()">➤</button>
</div>

<script>
async function sendMessage() {

const input = document.getElementById("message");
const text = input.value;

if (!text) return;

const response = await fetch(
"https://nova-ai.s67471219.workers.dev/",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
});

const data = await response.json();

document.querySelector(".chat").innerHTML +=
"<div class='message'>"+data.reply+"</div>";

input.value="";
}
</script>



</div>


<div class="menu">

<div class="item">
<span>💬</span>
Чат
</div>

<div class="item">
<span>📋</span>
Задачи
</div>

<div class="item">
<span>🔍</span>
Поиск
</div>

<div class="item">
<span>🧠</span>
Память
</div>

<div class="item">
<span>⚙️</span>
Настройки
</div>

</div>

<div id="chat">
  <div>Привет! Я Nova 👋</div>
</div>

<input id="message" placeholder="Напишите сообщение...">

<button onclick="sendMessage()">Отправить</button>

<script>
async function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value;

  if (!text) return;

  document.getElementById("chat").innerHTML +=
  "<p><b>Вы:</b> " + text + "</p>";

  const response = await fetch(
    "https://nova-ai.s67471219.workers.dev/",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    }
  );

  const data = await response.json();

  document.getElementById("chat").innerHTML +=
  "<p><b>Nova:</b> " + data.reply + "</p>";

  input.value = "";
}
</script>
</body>
</html>
